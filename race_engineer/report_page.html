<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column; summary line, then the track map as the hero, then the gain/loss table. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#14181d; --muted:#5d6874; --line:#d5dbe1;
  --gain:#0f9d58; --loss:#d93025; --flat:#9aa5b1; --accent:#1f5fbf; --you:#e07b00; --ai:#2f7fd0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1216; --panel:#161b21; --fg:#e8edf2; --muted:#94a0ad; --line:#2a323b;
  --gain:#34c77b; --loss:#ff5f52; --flat:#5f6b77; --accent:#6aa3ff; --you:#ffa033; --ai:#5aa7ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1216; --panel:#161b21; --fg:#e8edf2; --muted:#94a0ad; --line:#2a323b;
  --gain:#34c77b; --loss:#ff5f52; --flat:#5f6b77; --accent:#6aa3ff; --you:#ffa033; --ai:#5aa7ff; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,2.8rem);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.times{display:flex;flex-wrap:wrap;gap:12px 28px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.times div{display:grid}
.times b{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.1}
.times .g b{color:var(--gain)}
.map{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;color:var(--muted);align-items:center}
.sw{display:inline-block;width:22px;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
.tip{font-family:var(--mono);font-size:.85rem;min-height:2.6em;color:var(--fg);font-variant-numeric:tabular-nums}
.note{font-size:.85rem;color:var(--muted);max-width:68ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.cols > section{min-width:0}
h2{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0 0 6px;letter-spacing:.02em}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
td.n{text-align:right}
tr{cursor:pointer}
tr:hover td,tr.on td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.seg{cursor:pointer}
.seg:focus{outline:none}
.km{font-family:var(--mono);fill:var(--fg);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
@media (prefers-reduced-motion:no-preference){.seg{transition:stroke-width .15s}}

[hidden]{display:none!important}
section.block{display:grid;gap:8px}
.mode{font:inherit;font-size:.85rem;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.mode.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:2px}
.kv b{font-family:var(--display);font-size:1.4rem;font-weight:600}
.muted{color:var(--muted)} .tbl{overflow-x:auto}
</style>
</head><body>
<div class="wrap">
  <header style="display:grid;gap:10px">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <div class="times" id="times"></div>
  </header>
  <div class="map" id="mapbox">
    <div class="legend" id="modes"><label for="layer">Show on the map:</label>
      <select id="layer" class="mode"></select></div>
    <svg id="map" role="img" aria-label="Track map coloured by time gained or lost against the best AI lap in each 100 metres"></svg>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip">Tap or hover a section of track for its numbers.</div>
    <p class="note" id="layernote"></p>
    <div class="cols"><div class="tbl"><table id="layerA"></table></div><div class="tbl"><table id="layerB"></table></div></div>
  </div>
  <div class="cols">
    <section class="block"><h2>By type of track</h2><div class="tbl"><table id="types"></table></div></section>
    <section class="block"><h2>Corners: you vs the AI</h2><div class="tbl"><table id="corners"></table></div></section>
  </div>
  <div class="cols">
    <section class="block"><h2>Setup: you vs the AI</h2><div class="tbl"><table id="setup"></table></div><p class="note" id="rot"></p></section>
    <section class="block"><h2>Battery on your best lap</h2><div class="tbl"><table id="battery"></table></div></section>
  </div>
  <section class="block" id="attbox" hidden><h2 id="atth"></h2><div class="tbl"><table id="att"></table></div></section>
  <section class="block" id="prevbox" hidden><h2 id="prevh"></h2><p class="note" id="prevsum"></p>
    <div class="cols">
      <div class="tbl"><table id="prevtypes"></table></div>
      <div class="tbl"><table id="prevsetup"></table></div>
    </div>
    <div class="cols">
      <div class="tbl"><table id="prevup"></table></div>
      <div class="tbl"><table id="prevdown"></table></div>
    </div>
  </section>
  <section class="block" id="modelbox" hidden><h2>AI pace and the qualifying prediction</h2><div class="tbl"><table id="modelp"></table></div>
    <div class="tbl"><table id="modelpred"></table></div><p class="note" id="modelnote"></p></section>
  <section class="block"><h2>AI pace this weekend</h2><div class="tbl"><table id="pace"></table></div><p class="note" id="pred"></p></section>
  <section class="block" id="tyrebox" hidden><h2>Tyre wear</h2><p class="note" id="tyresum"></p>
    <div class="tbl"><table id="tyres"></table></div></section>
  <section class="block" id="fuelbox" hidden><h2>Fuel: what a race would need</h2><p class="note" id="fuelsum"></p>
    <div class="tbl"><table id="fuelplan"></table></div></section>
  <div class="cols">
    <section class="block"><h2>Race events</h2><div class="tbl"><table id="events"></table></div></section>
    <section class="block"><h2>Fuel at the start of each lap</h2><div class="tbl"><table id="fuel"></table></div></section>
  </div>
  <p class="note" id="foot"></p>
</div>
<script>
const D = __DATA__;
const fmt = ms => { if (ms == null) return "–"; const m = Math.floor(ms/60000), s = (ms%60000)/1000; return m+":"+s.toFixed(3).padStart(6,"0"); };
const sgn = (ms, d=3) => (ms > 0 ? "+" : ms < 0 ? "−" : "") + (Math.abs(ms)/1000).toFixed(d) + " s";
const T = (id, head, rows) => { document.getElementById(id).innerHTML = "<tr>" + head.map(h => `<th>${h}</th>`).join("") + "</tr>" + (rows.length ? rows.map(r => "<tr>" + r.map(c => `<td>${c ?? "–"}</td>`).join("") + "</tr>").join("") : `<tr><td colspan="${head.length}" class="muted">No data</td></tr>`); };
document.title = `${D.track} ${D.session} Report`;
document.getElementById("eyebrow").textContent = `${D.track} · ${D.session} · ${D.conditions} · ${D.folder}`;
if (D.error) { document.getElementById("h1").textContent = D.error; }
else {
  const gap = D.ai_ms != null ? D.your_ms - D.ai_ms : null;
  document.getElementById("h1").textContent = gap == null ? `Your best: ${fmt(D.your_ms)}` :
    (gap <= 0 ? `${(-gap/1000).toFixed(3)} s quicker than the best AI` : `${(gap/1000).toFixed(3)} s off the best AI`);
  document.getElementById("times").innerHTML =
    `<div><span class="eyebrow">Your best (${D.your_lap})</span><b>${fmt(D.your_ms)}</b></div>` +
    (D.ai_ms != null ? `<div><span class="eyebrow">Best AI: ${D.ai.charAt(0)+D.ai.slice(1).toLowerCase()} (${D.ai_lap})</span><b>${fmt(D.ai_ms)}</b></div>` +
      `<div class="${gap <= 0 ? "g" : ""}"><span class="eyebrow">Difference</span><b>${sgn(gap)}</b></div>` : "");
}
// ---- map
const P = D.points || [];
const SP = D.since_previous && !D.since_previous.error ? D.since_previous : null;
const LY = D.layers || {};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map"), tip = document.getElementById("tip"), legend = document.getElementById("legend");
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
const sw = (c, t) => `<span><span class="sw" style="background:${c}"></span>${t}</span>`;
let GEO = null, OVERLAY = null;
function geometry() {
  let area = 0; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i+1)%P.length]; area += a[1]*b[2] - b[1]*a[2]; }
  const sx = area < 0 ? -1 : 1, xs = P.map(p => sx*p[1]), ys = P.map(p => p[2]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys), pad = 110;
  return {xs, ys, scale: Math.max(maxX-minX, maxY-minY) / 600, box: `${minX-pad} ${minY-pad} ${maxX-minX+2*pad} ${maxY-minY+2*pad}`,
    at: d => { let k = P.findIndex(p => p[0] >= d); if (k < 0) k = P.length - 1; return [xs[k], ys[k]]; }};
}
function baseMap() {
  svg.innerHTML = ""; svg.setAttribute("viewBox", GEO.box); const {xs, ys, scale} = GEO;
  svg.appendChild(el("polyline", {points: P.map((p,i) => xs[i]+","+ys[i]).join(" ") + " " + xs[0]+","+ys[0], fill: "none", stroke: "var(--line)", "stroke-width": 16*scale, "stroke-linejoin": "round", "stroke-linecap": "round"}));
}
function kmMarks() {
  const {xs, ys, scale} = GEO;
  for (let m = 0; m < D.track_length; m += 1000) { const k = P.findIndex(p => p[0] >= m); if (k < 0) continue;
    svg.appendChild(el("circle", {cx: xs[k], cy: ys[k], r: 6*scale, fill: m === 0 ? "var(--fg)" : "var(--panel)", stroke: "var(--fg)", "stroke-width": 2*scale}));
    const t = el("text", {x: xs[k] + 14*scale, y: ys[k] - 12*scale, class: "km", "font-size": 22*scale}); t.textContent = m === 0 ? "Start / finish" : m + " m"; svg.appendChild(t); }
}
function segLine(s, color, w, onShow) {
  const pts = []; for (let k = 0; k < P.length; k++) if (P[k][0] >= s.from_m && P[k][0] < s.to_m) pts.push(k);
  if (!pts.length) return null; const last = pts[pts.length-1]; pts.push(last + 1 < P.length ? last + 1 : 0);
  const line = el("polyline", {points: pts.map(k => GEO.xs[k]+","+GEO.ys[k]).join(" "), fill: "none", stroke: color, "stroke-width": w,
    "stroke-linecap": "round", "stroke-linejoin": "round", class: "seg", tabindex: 0});
  line.dataset.w = w; ["mouseenter", "click", "focus"].forEach(ev => line.addEventListener(ev, onShow)); svg.appendChild(line); return line;
}
const f1 = v => v == null ? "–" : +v.toFixed(1);
// --- layers that colour 50 m or 100 m sections
function drawSections(segs, colorOf, widthOf, text) {
  const els = [];
  segs.forEach((s, i) => { const w = widthOf(s) * GEO.scale; const e = segLine(s, colorOf(s), w, () => { tip.innerHTML = text(s);
    els.forEach((x, j) => x && x.setAttribute("stroke-width", (j === i ? 1.6 : 1) * +x.dataset.w)); }); els[i] = e; });
}
function showTime(mode) {
  const M = mode === "ai" ? {segs: D.segments || [], a: "you", b: "AI", ak: "you_min_kmh", bk: "ai_min_kmh", good: "You quicker than the AI", bad: "You slower than the AI"}
    : {segs: SP.segments, a: "now", b: SP.previous, ak: "now_min_kmh", bk: "then_min_kmh", good: `Quicker than in ${SP.previous}`, bad: `Slower than in ${SP.previous}`};
  drawSections(M.segs, s => Math.abs(s.gain_ms) < 10 ? "var(--flat)" : (s.gain_ms > 0 ? "var(--gain)" : "var(--loss)"),
    s => 5 + 9 * Math.min(Math.abs(s.gain_ms), 200) / 200,
    s => { const g = s.gain_ms, what = Math.abs(g) < 10 ? "about level" : (g > 0 ? `${M.a} ${(g/1000).toFixed(3)} s quicker` : `${M.b} ${(-g/1000).toFixed(3)} s quicker`);
      return `<b>${s.from_m}–${s.to_m} m</b> · ${what} · min speed ${M.a} ${s[M.ak]} km/h vs ${M.b} ${s[M.bk]} km/h`; });
  legend.innerHTML = sw("var(--gain)", M.good) + sw("var(--loss)", M.bad) + sw("var(--flat)", "Within 0.010 s") + "<span>Thicker = bigger difference</span>";
  document.getElementById("layernote").textContent = ""; document.getElementById("layerA").innerHTML = ""; document.getElementById("layerB").innerHTML = "";
}
function showPair(L) {
  const segs = L.segments, mx = Math.max(...segs.map(s => Math.abs(s.you - s.ai)), 1e-9), bad = L.higher === "bad";
  const hi = bad ? "var(--loss)" : "var(--you)", lo = bad ? "var(--gain)" : "var(--ai)";
  drawSections(segs, s => Math.abs(s.you - s.ai) < 0.04 * mx ? "var(--flat)" : (s.you > s.ai ? hi : lo),
    s => 5 + 9 * Math.min(1, Math.abs(s.you - s.ai) / (0.6 * mx)),
    s => `<b>${s.from_m}–${s.to_m} m</b> · you ${f1(s.you)} ${L.unit} · AI ${f1(s.ai)} ${L.unit} · difference ${f1(s.you - s.ai)} ${L.unit}`);
  legend.innerHTML = sw(hi, bad ? "You use more than the AI" : "You use more than the AI") + sw(lo, bad ? "You use less than the AI" : "The AI uses more than you") + sw("var(--flat)", "About level") + "<span>Thicker = bigger difference</span>";
  document.getElementById("layernote").textContent = L.explain;
  const d = segs.map(s => ({s, d: s.you - s.ai}));
  const row = x => [`${x.s.from_m}–${x.s.to_m} m`, `${f1(x.s.you)}`, `${f1(x.s.ai)}`, `${x.d > 0 ? "+" : "−"}${f1(Math.abs(x.d))}`];
  T("layerA", [bad ? `Where you use most more than the AI (${L.unit})` : `You use more (${L.unit})`, "You", "AI", "Diff"], d.filter(x => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 6).map(row));
  T("layerB", [bad ? `Where you use less than the AI (${L.unit})` : `The AI uses more (${L.unit})`, "You", "AI", "Diff"], d.filter(x => x.d < 0).sort((a, b) => a.d - b.d).slice(0, 6).map(row));
}
// --- layers that mark points (braking, acceleration)
function showMarkers(L, kind) {
  const {scale} = GEO, brake = kind === "braking";
  L.items.forEach((it, i) => {
    const a = it.you_m != null ? GEO.at(it.you_m) : null, b = it.ai_m != null ? GEO.at(it.ai_m) : null;
    const text = brake
      ? `<b>Braking zone ${i + 1}</b> · you start at ${it.you_m ?? "–"} m, AI at ${it.ai_m ?? "–"} m${it.diff_m != null ? ` (you ${it.diff_m > 0 ? "later" : it.diff_m < 0 ? "earlier" : "level"} by ${Math.abs(it.diff_m)} m)` : ""} · entry speed ${it.you_entry_kmh ?? "–"} / ${it.ai_entry_kmh ?? "–"} km/h · peak brake ${it.you_peak_pct ?? "–"} / ${it.ai_peak_pct ?? "–"} %`
      : `<b>Corner ${it.corner} (${it.type})</b> · full throttle at ${it.you_m ?? "–"} m (you) vs ${it.ai_m ?? "–"} m (AI)${it.diff_m != null ? ` (you ${it.diff_m < 0 ? "earlier" : it.diff_m > 0 ? "later" : "level"} by ${Math.abs(it.diff_m)} m)` : ""} · speed 100 m later ${it.you_exit_kmh ?? "–"} / ${it.ai_exit_kmh ?? "–"} km/h`;
    const g = el("g", {tabindex: 0, class: "seg"}); const show = () => { tip.innerHTML = text; };
    ["mouseenter", "click", "focus"].forEach(ev => g.addEventListener(ev, show));
    if (a && b) g.appendChild(el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "var(--fg)", "stroke-width": 3 * scale}));
    if (b) g.appendChild(el("circle", {cx: b[0], cy: b[1], r: 8 * scale, fill: "var(--ai)", stroke: "var(--panel)", "stroke-width": 2 * scale}));
    if (a) g.appendChild(el("circle", {cx: a[0], cy: a[1], r: 10 * scale, fill: "var(--you)", stroke: "var(--panel)", "stroke-width": 2 * scale}));
    const t = el("text", {x: (a || b)[0] + 14 * scale, y: (a || b)[1] - 12 * scale, class: "km", "font-size": 24 * scale}); t.textContent = brake ? i + 1 : it.corner; g.appendChild(t);
    svg.appendChild(g);
  });
  legend.innerHTML = sw("var(--you)", "You") + sw("var(--ai)", "Best AI lap") + "<span>The line joins the two points</span>";
  document.getElementById("layernote").textContent = L.explain;
  const d = v => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v) + " m";
  if (brake) {
    T("layerA", ["Zone", "You start", "AI starts", "Difference", "Entry speed you / AI", "Peak brake you / AI"], L.items.map((it, i) =>
      [i + 1, it.you_m ?? "–", it.ai_m ?? "–", d(it.diff_m), `${it.you_entry_kmh ?? "–"} / ${it.ai_entry_kmh ?? "–"}`, `${it.you_peak_pct ?? "–"} / ${it.ai_peak_pct ?? "–"} %`]));
  } else {
    T("layerA", ["Corner", "Apex speed you / AI", "Full throttle you / AI", "Difference", "Speed 100 m later you / AI"], L.items.map(it =>
      [`${it.corner} (${it.type})`, `${it.you_apex_kmh ?? "–"} / ${it.ai_apex_kmh ?? "–"}`, `${it.you_m ?? "–"} / ${it.ai_m ?? "–"} m`, d(it.diff_m), `${it.you_exit_kmh ?? "–"} / ${it.ai_exit_kmh ?? "–"}`]));
  }
  document.getElementById("layerB").innerHTML = "";
}
const LAYER_DEFS = [["ai", "Time against the best AI"], ["prev", SP ? `Time against your ${SP.previous}` : null], ["battery", "Battery deployment"],
  ["braking", "Braking points"], ["acceleration", "Acceleration points (corner exits)"], ["fuel", "Fuel use by section: saving points"], ["tyres", "Tyre wear by section"]];
function drawLayer(id) {
  baseMap();
  if (id === "ai" || id === "prev") showTime(id);
  else { const L = LY[id]; if (L && L.available) { L.kind === "pair" ? showPair(L) : showMarkers(L, id); } }
  kmMarks();
  tip.textContent = "Tap or hover a section or point of track for its numbers.";
}
if (P.length > 10 && (D.segments || []).length) {
  GEO = geometry();
  const sel = document.getElementById("layer");
  LAYER_DEFS.forEach(([id, name]) => { if (!name) return; const L = LY[id], off = id !== "ai" && id !== "prev" && !(L && L.available);
    const o = document.createElement("option"); o.value = id; o.textContent = name + (off ? ` (${L && L.note ? L.note : "not available"})` : ""); o.disabled = off; sel.appendChild(o); });
  sel.addEventListener("change", () => drawLayer(sel.value));
  drawLayer("ai");
} else { document.getElementById("mapbox").hidden = true; }

// ---- tables
const bt = D.by_type_ms || {};
T("types", ["Type", "Time vs AI"], ["slow","medium","fast","straight"].filter(k => k in bt).map(k => [k, `<span class="${bt[k] > 0 ? "loss" : "gain"}">${bt[k] > 0 ? "lose " : "gain "}${(Math.abs(bt[k])/1000).toFixed(3)} s</span>`]));
T("corners", ["Corner", "Time", "Apex you / AI", "Brake you / AI", "Full throttle you / AI"], (D.corners || []).map(c =>
  [`${c.from_m}–${c.to_m} m (${c.type})`, `<span class="${c.loss_ms > 0 ? "loss" : "gain"}">${c.loss_ms > 0 ? "lose " : "gain "}${(Math.abs(c.loss_ms)/1000).toFixed(3)} s</span>`, `${c.you.apex_speed} / ${c.them.apex_speed} km/h`, `${c.you.brake_at_m ?? "–"} / ${c.them.brake_at_m ?? "–"} m`, `${c.you.full_throttle_at_m ?? "–"} / ${c.them.full_throttle_at_m ?? "–"} m`]));
const sd = D.setup_differences || {};
T("setup", ["Setting", "You", "AI"], Object.entries(sd).map(([k, v]) => [k, typeof v.you === "number" ? +v.you.toFixed(2) : v.you, typeof v.them === "number" ? +v.them.toFixed(2) : v.them]));
if (D.rule_of_thumb) document.getElementById("rot").textContent = (D.rule_of_thumb.weakest ? `Weakest area: ${D.rule_of_thumb.weakest}. Rule of thumb, not measured from your data: ${D.rule_of_thumb.text}` : D.rule_of_thumb.text) + ` AI setups are generic and AI pace comes mostly from the difficulty setting, so treat their values as a comparison, not a target.`;
if ((D.setup_suggestions || []).length) document.getElementById("rot").textContent += "  Suggestion: " + D.setup_suggestions.map(x => `${x.setting} ${x.you} (AI ${x.ai}), try ${x.try}. ${x.why}`).join(" ");
const by = D.battery_you, ba = D.battery_ai;
if (by) T("battery", ["", "You", "AI"], [["Start → end", `${by.store_start_MJ.toFixed(2)} → ${by.store_end_MJ.toFixed(2)} MJ`, ba ? `${ba.store_start_MJ.toFixed(2)} → ${ba.store_end_MJ.toFixed(2)} MJ` : "–"],
  ["Used / harvested", `${by.deployed_MJ.toFixed(2)} / ${by.harvested_MJ.toFixed(2)} MJ`, ba ? `${ba.deployed_MJ.toFixed(2)} / ${ba.harvested_MJ.toFixed(2)} MJ` : "–"],
  ["Lowest", `${by.store_min_MJ.toFixed(2)} MJ at ${by.store_min_at_m} m`, ba ? `${ba.store_min_MJ.toFixed(2)} MJ at ${ba.store_min_at_m} m` : "–"]]);
else T("battery", ["Battery"], [["Not used in this session type."]]);
const AT = D.attempts;
if (AT && AT.of > 1) {
  document.getElementById("attbox").hidden = false;
  document.getElementById("atth").textContent = `Restarts: this is attempt ${AT.number} of ${AT.of} of this session`;
  T("att", ["Attempt", "Your best", "Best AI", "Setup changes from the attempt before"], AT.list.map((a, i) => [
    (a.this ? "▶ " : "") + (i + 1), fmt(a.best_ms), fmt(a.ai_best_ms),
    a.setup_changes == null ? (i ? "not available" : "first attempt") :
      (Object.keys(a.setup_changes).length ? Object.entries(a.setup_changes).map(([k, v]) => `${k} ${typeof v.before === "number" ? +v.before.toFixed(2) : v.before} → ${typeof v.after === "number" ? +v.after.toFixed(2) : v.after}`).join(", ") : "none")]));
}
if (D.since_previous) {
  const X = D.since_previous;
  document.getElementById("prevbox").hidden = false;
  document.getElementById("prevh").textContent = `Since ${X.previous}`;
  if (X.error) { document.getElementById("prevsum").textContent = X.error; }
  else {
    const ai = X.ai_best_then_ms != null && X.ai_best_now_ms != null ? ` The best AI lap went from ${fmt(X.ai_best_then_ms)} to ${fmt(X.ai_best_now_ms)} (${sgn(X.ai_best_now_ms - X.ai_best_then_ms)}).` : "";
    document.getElementById("prevsum").textContent = `Your best: ${fmt(X.your_then_ms)} then, ${fmt(X.your_now_ms)} now (${X.gain_ms >= 0 ? (X.gain_ms/1000).toFixed(3) + " s quicker" : (-X.gain_ms/1000).toFixed(3) + " s slower"}).` + ai + " Track grip and fuel also change between sessions, so not every difference is the setup.";
    const bt2 = X.by_type_gain_ms;
    T("prevtypes", ["Type", "Now vs then"], ["slow","medium","fast","straight"].map(k => [k, `<span class="${bt2[k] >= 0 ? "gain" : "loss"}">${bt2[k] >= 0 ? "gain " : "lose "}${(Math.abs(bt2[k])/1000).toFixed(3)} s</span>`]));
    T("prevsetup", ["Setup change", "Then", "Now"], Object.entries(X.setup_changes).map(([k, v]) => [k, typeof v.then === "number" ? +v.then.toFixed(2) : v.then, typeof v.now === "number" ? +v.now.toFixed(2) : v.now]));
    const ss = X.segments.slice();
    T("prevup", ["Most improved", "Gain", "Min speed then / now"], ss.filter(x => x.gain_ms >= 10).sort((a, b) => b.gain_ms - a.gain_ms).slice(0, 5).map(x => [`${x.from_m}–${x.to_m} m (${x.type})`, sgn(x.gain_ms), `${x.then_min_kmh} / ${x.now_min_kmh} km/h`]));
    T("prevdown", ["Got slower", "Loss", "Min speed then / now"], ss.filter(x => x.gain_ms <= -10).sort((a, b) => a.gain_ms - b.gain_ms).slice(0, 5).map(x => [`${x.from_m}–${x.to_m} m (${x.type})`, sgn(-x.gain_ms), `${x.then_min_kmh} / ${x.now_min_kmh} km/h`]));
  }
}
const TY = D.tyres;
if (TY) {
  document.getElementById("tyrebox").hidden = false;
  const short = ["RL", "RR", "FL", "FR"];
  const r = TY.stint_rate_per_lap, ai = TY.ai;
  const fmtLeft = v => v == null ? "–" : (v === 0 ? "over" : v + " laps");
  document.getElementById("tyresum").textContent = (r ? `Your current set wore ${TY.your_avg_rate} % a lap on average over ${TY.stint_laps} laps (` + short.map((w, i) => `${w} ${r[i]}`).join(", ") + `). At that rate it reaches ${TY.limit_pct}% in about: ` + short.map((w, i) => `${w} ${fmtLeft(TY.laps_to_limit[i])}`).join(", ") + ". " : "") +
    (ai ? `The ${ai.cars} AI cars wore ${ai.median_rate_per_lap} % a lap (median). ` : "") +
    "A straight-line estimate: real wear is not even from lap to lap. Wheel order is from the game's specification (rear-left, rear-right, front-left, front-right) and is not yet confirmed.";
  T("tyres", ["Lap", "Tyre", "Age", "RL %", "RR %", "FL %", "FR %"], TY.laps.map(l => [l.lap === 0 ? "start" : l.lap, l.compound, l.age ?? "–"].concat(l.wear)));
}
const FP = D.fuel_plan;
if (FP) {
  document.getElementById("fuelbox").hidden = false;
  const cs = Object.keys(FP.conditions), counts = Object.keys(FP.conditions[cs[0]].need_kg);
  const prev = FP.previous ? FP.previous.conditions : {};
  document.getElementById("fuelsum").textContent = cs.map(c => { const x = FP.conditions[c], p = prev[c];
    return `${c}: you burn ${x.burn_kg} kg a lap (median of ${x.laps} laps, range ${x.min_kg}–${x.max_kg})` +
      (p ? `, ${p.burn_kg} kg in ${FP.previous.name}` + (Math.abs(x.burn_kg - p.burn_kg) >= 0.005 ? ` (${x.burn_kg > p.burn_kg ? "+" : "−"}${Math.abs(x.burn_kg - p.burn_kg).toFixed(3)} kg a lap)` : "") : ""); }).join(". ") +
    `. Start fuel includes ${FP.assumptions.formation_laps} formation lap and ${FP.assumptions.margin_laps} lap of margin (my assumptions). Safety car laps and pit laps are left out, so a race with a safety car needs less. Burn also depends on how you drive and how you use the battery.`;
  T("fuelplan", ["Race length"].concat(cs.map(c => `Start fuel (${c})`)), counts.map(n => [`${n} laps`].concat(cs.map(c => `${FP.conditions[c].need_kg[n]} kg`))));
}
const pc = D.pace || {};
const MD = pc.model;
if (MD) {
  document.getElementById("modelbox").hidden = false;
  const pctf = v => v == null ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + " %";
  T("modelp", ["Practice session", "AI median", "Best AI", "Median vs previous session", "Best vs previous session"],
    MD.practice.map(r => [r.folder.slice(0, 16), fmt(r.median_ms), fmt(r.best_ms),
      r.step ? `${sgn(-r.step.median_ms)} (${pctf(r.step.median_pct)})` : "–", r.step ? `${sgn(-r.step.best_ms)} (${pctf(r.step.best_pct)})` : "–"]));
  const A = MD.actual;
  T("modelpred", ["Prediction for qualifying", "Gain used", "AI median", "Best AI lap"].concat(A ? ["Median error", "Best-lap error"] : []),
    MD.levels.map((l, i) => [(i === 0 ? "▶ " : "") + l.label, `${l.median_gain_pct} % / ${l.best_gain_pct} %`, fmt(l.median_ms), fmt(l.best_ms)].concat(A ?
      (() => { const e = A.errors.find(x => x.level === l.level); return e ? [sgn(e.median_error_ms), sgn(e.best_error_ms)] : ["–", "–"]; })() : [])));
  document.getElementById("modelnote").textContent = (MD.note || "") +
    (A ? ` Actual qualifying: AI median ${fmt(A.median_ms)}, best AI lap ${fmt(A.best_ms)}: ${A.saved} Errors are prediction minus actual (a plus means the model was too slow).` : "") +
    " The prediction applies a % gain to the last practice; the gain comes from saved real gains where there are any, otherwise from this weekend's practice improvements. A model, not a measurement.";
}
T("pace", ["Session", "Conditions", "Best AI", "AI top-5 median", "You"], (pc.weekend || []).map(e => [e.folder.slice(0, 16), e.conditions, fmt(e.ai_best_ms), fmt(e.ai_top5_median_ms), fmt(e.my_best_ms)]));
const pr = pc.prediction;
document.getElementById("pred").textContent = MD ? "" : pr ? (pr.methods.length ? "Predicted best AI qualifying lap (" + pr.conditions + "): " + pr.methods.map(m => `${fmt(m.ai_quali_ms)} from ${m.method}`).join("; ") + ". A prediction, not a measurement." : (pr.note || "")) : "Prediction is made after practice sessions.";
const evRows = (D.safety_car || []).map(s => ({t: s.t, lap: s.lap, text: `Safety car status: ${s.status}`})).concat((D.events || []).map(e => ({t: e.t, lap: e.lap, text: e.text})));
evRows.sort((a, b) => (a.lap ?? 0) - (b.lap ?? 0) || a.t - b.t);
T("events", ["Your lap", "Event"], evRows.map(e => [e.lap ?? "–", e.text]));
T("fuel", ["Lap", "Fuel", "Lap time"], (D.fuel || []).map(f => [f.lap, `${f.fuel_start_kg} kg`, fmt(f.time_ms)]));
document.getElementById("foot").textContent = `Each map section is 100 m of lap distance, your best clean lap against the best clean AI lap. The map shape is your car's position on that lap; its rotation comes from the game's coordinates. Generated ${D.generated}.` + (D.compare_note ? " " + D.compare_note : "");
</script>
</body></html>
